name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: OpenAPI contract drift
        run: uv run python -m fulcrum.openapi --check

      - name: Markdown local links
        run: uv run python scripts/check_markdown_links.py

      - name: Ruff lint
        run: uv run ruff check src tests scripts/check_markdown_links.py

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts/check_markdown_links.py

      - name: Pyright type check
        run: uv run pyright

      - name: Import-linter(依赖方向)
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest -q
